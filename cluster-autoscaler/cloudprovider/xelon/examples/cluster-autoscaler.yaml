apiVersion: v1
kind: ServiceAccount
metadata:
  name: xelon-cluster-autoscaler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: xelon-cluster-autoscaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xelon-cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["events", "endpoints"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["watch", "list", "get", "update"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices", "deviceclasses", "resourceclaims"]
    verbs: ["watch", "list", "get"]
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - services
      - replicationcontrollers
      - persistentvolumeclaims
      - persistentvolumes
      - configmaps
    verbs: ["watch", "list", "get"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["watch", "list", "get", "patch"]
  - apiGroups: ["extensions"]
    resources: ["replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["watch", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities", "volumeattachments"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xelon-cluster-autoscaler
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cluster-autoscaler-status"]
    verbs: ["delete", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xelon-cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xelon-cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: xelon-cluster-autoscaler
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xelon-cluster-autoscaler
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: xelon-cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: xelon-cluster-autoscaler
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: xelon-cluster-autoscaler
  namespace: kube-system
type: Opaque
stringData:
  cloud-config.json: |
    {
      "base_url": "https://hq.xelon.ch/api/v2/",
      "token": "REPLACE_XELON_TOKEN",
      "client_id": "REPLACE_XELON_CLIENT_ID",
      "cluster_id": "REPLACE_XKS_CLUSTER_ID"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xelon-cluster-autoscaler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: xelon-cluster-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xelon-cluster-autoscaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xelon-cluster-autoscaler
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: xelon-cluster-autoscaler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cluster-autoscaler
          image: xelonag/cluster-autoscaler-xelon:v1.35.2-xelon.0
          imagePullPolicy: IfNotPresent
          args:
            - --cloud-provider=xelon
            - --cloud-config=/etc/xelon/cloud-config.json
            - --nodes=1:3:REPLACE_XKS_POOL_ID
            - --max-nodes-per-scaleup=1
            - --max-scale-down-parallelism=1
            - --force-delete-unregistered-nodes=false
            - --force-delete-failed-nodes=false
            - --scale-up-from-zero=false
            - --max-node-provision-time=15m
            - --v=4
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              cpu: 500m
              memory: 600Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cloud-config
              mountPath: /etc/xelon
              readOnly: true
      volumes:
        - name: cloud-config
          secret:
            secretName: xelon-cluster-autoscaler
