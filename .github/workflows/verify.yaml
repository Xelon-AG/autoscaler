name: Verify Go

on:
  - push
  - pull_request

env:
  GOPATH: ${{ github.workspace }}/go

permissions:
  contents: read
  checks: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ${{ env.GOPATH }}/src/k8s.io/autoscaler

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.25'
          cache-dependency-path: |
             ${{ env.GOPATH}}/src/k8s.io/autoscaler/cluster-autoscaler/go.sum
             ${{ env.GOPATH}}/src/k8s.io/autoscaler/vertical-pod-autoscaler/go.sum
             ${{ env.GOPATH}}/src/k8s.io/autoscaler/vertical-pod-autoscaler/e2e/go.sum

      - name: Apt-get
        run: sudo apt-get install libseccomp-dev -qq

      - name: Prepare
        working-directory: ${{ env.GOPATH }}/src/k8s.io/autoscaler
        run: hack/install-verify-tools.sh
        env:
          GO111MODULE: auto

      - name: Verify
        working-directory: ${{ env.GOPATH }}/src/k8s.io/autoscaler
        run: hack/verify-all.sh -v
        env:
          # Go 1.26 exposes pre-existing golint findings throughout the
          # upstream tree. Xelon is linted separately below.
          EXCLUDE: verify-golint.sh
          GO111MODULE: auto

      - name: Lint Xelon provider
        working-directory: ${{ env.GOPATH }}/src/k8s.io/autoscaler/cluster-autoscaler
        shell: bash
        run: |
          lint_output=$(golint -min_confidence=0.9 ./cloudprovider/xelon/...)
          lint_output=$(printf '%s\n' "$lint_output" | sed '/method Id should be ID$/d')
          if [[ -n "$lint_output" ]]; then
            printf '%s\n' "$lint_output"
            exit 1
          fi
